# Configurazione pipeline bolle fornitori.
# Copiare in config/settings.yaml e adattare. settings.yaml NON va versionato.

ocr:
  # paddleocr_vl: motore primario, richiede CPU con AVX (macchina nuova).
  # dots_ocr:     alternativa via llama.cpp per CPU/VM senza AVX.
  engine: paddleocr_vl
  resize_px: 1024             # sweet spot per inferenza su CPU
  table_mode: true
  confidence_threshold: 0.80  # righe sotto soglia -> coda di revisione
  # Riconoscimento fornitore: il primo pattern che matcha sul .md vince.
  # I pattern sono regex (case-insensitive). Vanno bene sia ragioni sociali
  # (es. "Verniciatura\\s*Bolognese") sia firme nel numero bolla (es. "26DT-\\d+").
  fornitori_noti:
    - pattern: "Verniciatura\\s*Bolognese|vernibo|26DT-\\d+"
      nome: "VERNICIATURA BOLOGNESE S.R.L."
    - pattern: "SOFT\\s*Italia"
      nome: "SOFT ITALIA S.P.A."
    - pattern: "Camozzi\\s*Automation"
      nome: "CAMOZZI AUTOMATION S.P.A."
    - pattern: "ZINC[\\s\\-]*CROM"
      nome: "ZINC-CROM S.R.L."

llm:
  enabled: true               # LLM piccolo SOLO per testata e casi sporchi
  base_url: http://localhost:11434
  model: qwen2.5:7b-instruct-q4_K_M
  timeout_s: 60

api:
  backend: http                     # http = API aziendali; memory = nessuna API (offline)
  base_url: http://localhost:8080   # API REST aziendali (verso Oracle)
  token: null                       # meglio via env BOLLE_API_TOKEN
  timeout_s: 30
  dry_run: true                     # true: non scrive su Oracle (sviluppo)

paths:
  inbox: ./inbox
  work: ./work
  review_queue: ./work/revisione
